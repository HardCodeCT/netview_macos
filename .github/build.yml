name: Build and Release NetView for macOS

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
        
    - name: Build NetView
      run: |
        cd NetViewMac
        xcodebuild -project NetView.xcodeproj \
          -scheme NetView \
          -configuration Release \
          -derivedDataPath ./build \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO
          
    - name: Create app bundle directory
      run: |
        mkdir -p dist
        cp -R NetViewMac/build/Build/Products/Release/NetView.app dist/
        
    - name: Install create-dmg
      run: |
        brew install create-dmg
        
    - name: Create DMG
      run: |
        create-dmg \
          --volname "NetView Installer" \
          --window-pos 200 120 \
          --window-size 600 400 \
          --icon-size 100 \
          --icon "NetView.app" 175 120 \
          --hide-extension "NetView.app" \
          --app-drop-link 425 120 \
          --no-internet-enable \
          "NetView-macOS.dmg" \
          "dist/"
          
    - name: Upload DMG artifact
      uses: actions/upload-artifact@v4
      with:
        name: NetView-macOS-DMG
        path: NetView-macOS.dmg
        retention-days: 90
        
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: NetView-macOS.dmg
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
